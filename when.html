<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f2" />
    <title>When are we celebrating?</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="flow-shell compact-shell">
      <nav class="progress" aria-label="Proposal progress">
        <span class="done">Yes!</span><span class="done">Food</span><span class="active">When</span><span>T&amp;Cs</span><span>Us</span>
      </nav>
      <header class="flow-header">
        <p class="kicker">Save the date</p>
        <h1>When are you coming over to celebrate?</h1>
        <p>I’ll be ready suspiciously early. You just pick the date and time.</p>
      </header>
      <section class="date-card" aria-label="Choose a date and time">
        <div class="field">
          <label for="date">Our date</label>
          <div class="picker-shell">
            <span class="picker-value" id="date-display">Choose a date</span>
            <svg class="picker-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" /></svg>
            <input type="date" id="date" name="date" required />
          </div>
        </div>
        <div class="field">
          <label for="time">Your grand arrival</label>
          <div class="picker-shell">
            <span class="picker-value placeholder" id="time-display">Choose a time</span>
            <svg class="picker-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            <input type="time" id="time" name="time" required />
          </div>
        </div>
        <p class="date-aside">I’ll provide the food. You provide your very cute face.</p>
      </section>
      <div class="flow-actions">
        <button type="button" class="cta" id="next" disabled>Review the fine print</button>
        <p class="selection-hint" id="when-hint">Both fields are legally romantic.</p>
      </div>
    </main>
    <script src="js/plan.js"></script>
    <script>
      const date = document.getElementById("date");
      const time = document.getElementById("time");
      const next = document.getElementById("next");
      const hint = document.getElementById("when-hint");
      const dateDisplay = document.getElementById("date-display");
      const timeDisplay = document.getElementById("time-display");
      const today = new Date();
      const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().split("T")[0];
      date.min = localToday;
      date.value = localToday;

      function showDate(value) {
        if (!value) return "Choose a date";
        return new Date(`${value}T12:00:00`).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      }

      function showTime(value) {
        if (!value) return "Choose a time";
        const [hours, minutes] = value.split(":");
        const selected = new Date();
        selected.setHours(Number(hours), Number(minutes), 0, 0);
        return selected.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      }

      function sync() {
        dateDisplay.textContent = showDate(date.value);
        timeDisplay.textContent = showTime(time.value);
        dateDisplay.classList.toggle("placeholder", !date.value);
        timeDisplay.classList.toggle("placeholder", !time.value);
        next.disabled = !(date.value && time.value);
        hint.textContent = next.disabled ? "Choose a time and we have ourselves a date." : "Perfect. I’m already counting down.";
      }
      date.addEventListener("input", sync);
      date.addEventListener("change", sync);
      time.addEventListener("input", sync);
      time.addEventListener("change", sync);
      sync();
      next.addEventListener("click", () => {
        if (next.disabled) return;
        savePlan({ date: date.value, time: time.value });
        location.href = "terms.html";
      });
    </script>
  </body>
</html>
