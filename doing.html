<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What we're doing</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      :root {
        --glow: 0.3;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <p class="eyebrow">Step 2 — the night</p>
      <h1>So what are we <em>doing?</em></h1>
      <p class="sub">Take as many as you want. Greedy is encouraged.</p>

      <div class="grid">
        <label class="pick">
          <input type="checkbox" name="doing" value="Cuddling" />
          <span class="icon">🫂</span>
          <span class="name">Cuddling</span>
          <span class="note">Non-negotiable, I've decided</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Gaming" />
          <span class="icon">🎮</span>
          <span class="name">Gaming</span>
          <span class="note">I'll let you win. Once.</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Watching movies" />
          <span class="icon">🎬</span>
          <span class="name">Movies</span>
          <span class="note">You hold the remote</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Listening to music" />
          <span class="icon">🎧</span>
          <span class="name">Music</span>
          <span class="note">Your aux, my speakers</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Cooking something together" />
          <span class="icon">🍳</span>
          <span class="name">Cooking</span>
          <span class="note">We ruin a kitchen together</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Talking until it's late" />
          <span class="icon">🌙</span>
          <span class="name">Talking</span>
          <span class="note">Until neither of us notices the time</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Absolutely nothing" />
          <span class="icon">🛋️</span>
          <span class="name">Nothing</span>
          <span class="note">Same room, zero plans</span>
        </label>

        <label class="pick">
          <input type="checkbox" name="doing" value="Whatever you want" />
          <span class="icon">✨</span>
          <span class="name">Your call</span>
          <span class="note">Surprise me</span>
        </label>
      </div>

      <button type="button" class="cta" id="next" disabled>Locked in</button>
    </main>

    <script src="js/plan.js"></script>
    <script>
      wireStep({
        inputName: "doing",
        button: document.getElementById("next"),
        key: "doing",
        next: "snacks",
      });
    </script>
  </body>
</html>
