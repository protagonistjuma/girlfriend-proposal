<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f2" />
    <title>Trinah, one tiny question…</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="proposal-page">
    <main class="proposal-shell">
      <section class="love-note" aria-labelledby="proposal-title">
        <span class="tape" aria-hidden="true"></span>
        <p class="kicker">A very important question for Trinah</p>
        <h1 id="proposal-title">Will you be my girlfriend?</h1>
        <p class="proposal-copy">
          I like you a completely normal amount. By “normal,” I mean I made you
          a whole website to ask one question.
        </p>

        <div class="answers" id="answers">
          <button type="button" class="cta cta-big" id="yes">
            Yes, obviously 💌
          </button>
          <button type="button" class="ghost no-button" id="no">No</button>
        </div>
        <p class="tiny-note" id="no-note" aria-live="polite">
          Choose carefully. One option has snacks.
        </p>
      </section>

      <aside class="photo-card" aria-label="A very persuasive cat">
        <video class="proposal-video" src="cat.mp4" autoplay muted loop playsinline preload="auto"></video>
        <p>Live footage of me waiting for your answer.</p>
      </aside>

      <span class="doodle doodle-heart" aria-hidden="true">♥</span>
      <span class="doodle doodle-arrow" aria-hidden="true">↝</span>
    </main>

    <script src="js/plan.js"></script>
    <script src="js/video.js"></script>
    <script>
      clearPlan();
      const yes = document.getElementById("yes");
      const no = document.getElementById("no");
      const note = document.getElementById("no-note");
      const replies = ["No", "Trinah… be serious 😭", "That button seems suspicious", "Are you sure sure?", "I can add dessert", "The yes button is right there", "Okay, last chance 👀", "Nope, this button has resigned"];
      const notes = ["Choose carefully. One option has snacks.", "A bold opening move.", "I respect the drama. I reject the answer.", "Even the cat thinks that was a misclick.", "Counter-offer: food, cuddles, and me.", "This negotiation is going extremely well for me.", "The board has reviewed your answer.", "Motion denied. Please select yes."];

      let attempts = 0;
      yes.addEventListener("click", () => {
        savePlan({ acceptedAt: new Date().toISOString() });
        document.body.classList.add("said-yes");
        yes.textContent = "Yayyyyy! 💖";
        setTimeout(() => (location.href = "snacks.html"), 650);
      });

      no.addEventListener("click", () => {
        attempts += 1;
        const index = Math.min(attempts, replies.length - 1);
        no.textContent = replies[index];
        note.textContent = notes[index];
        yes.style.setProperty("--yes-scale", Math.min(1.34, 1 + attempts * 0.055));
        if (attempts >= 3) {
          const maxX = Math.min(90, window.innerWidth * 0.14);
          no.style.transform = `translate(${(Math.random() - 0.5) * maxX}px, ${(Math.random() - 0.5) * 36}px)`;
        }
      });
    </script>
  </body>
</html>
