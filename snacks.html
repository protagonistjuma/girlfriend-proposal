<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f2" />
    <title>Yayyyyy — celebration food</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="flow-shell">
      <nav class="progress" aria-label="Proposal progress">
        <span class="done">Yes!</span><span class="active">Food</span><span>When</span><span>T&amp;Cs</span><span>Us</span>
      </nav>
      <header class="flow-header">
        <p class="kicker">Excellent answer, Trinah</p>
        <h1>Yayyyyy, let’s celebrate with food!</h1>
        <p>Choose the winner. Girlfriend privileges start now.</p>
      </header>

      <section class="choice-grid" aria-label="Celebration food options">
        <label class="food-card"><input type="radio" name="food" value="Pizza" /><span class="food-emoji">🍕</span><span class="food-name">Pizza</span><span class="food-note">One slice for me, the rest mysteriously yours</span></label>
        <label class="food-card"><input type="radio" name="food" value="Chicken & chips" /><span class="food-emoji">🍗</span><span class="food-name">Chicken &amp; chips</span><span class="food-note">Reliable, elite, no notes</span></label>
        <label class="food-card"><input type="radio" name="food" value="Shawarmas" /><span class="food-emoji">🌯</span><span class="food-name">Shawarmas</span><span class="food-note">Wrapped, loaded, and celebration-ready</span></label>
        <label class="food-card"><input type="radio" name="food" value="Dessert mixture" /><span class="food-emoji">🍰</span><span class="food-name">Dessert mixture</span><span class="food-note">A little bit of every sweet thing</span></label>
      </section>

      <div class="flow-actions">
        <button type="button" class="cta" id="next" disabled>Plan our celebration</button>
        <p class="selection-hint" id="selection-hint">Pick one delicious thing.</p>
      </div>
    </main>
    <script src="js/plan.js"></script>
    <script>
      const inputs = [...document.querySelectorAll('input[name="food"]')];
      const next = document.getElementById("next");
      const hint = document.getElementById("selection-hint");
      function sync() {
        const selected = inputs.find((input) => input.checked);
        next.disabled = !selected;
        hint.textContent = selected ? `${selected.value} it is. Excellent taste.` : "Pick one delicious thing.";
      }
      inputs.forEach((input) => input.addEventListener("change", sync));
      next.addEventListener("click", () => {
        const food = inputs.find((input) => input.checked)?.value;
        if (!food) return;
        savePlan({ food });
        location.href = "when.html";
      });
    </script>
  </body>
</html>
